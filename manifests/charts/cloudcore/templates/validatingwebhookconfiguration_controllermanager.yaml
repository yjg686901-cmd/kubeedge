{{- if and .Values.controllerManager.enable .Values.controllerManager.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kubeedge-crds-validate-webhook-configuration
webhooks:
  - name: validatedevice.kubeedge.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Ignore
    clientConfig:
      service:
        name: kubeedge-admission-service
        namespace: {{ .Release.Namespace }}
        path: /devices
        port: 443
      caBundle: {{ .Values.controllerManager.webhook.caBundle }}
    rules:
      - apiGroups:
          - devices.kubeedge.io
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - devices

  - name: validatedevicemodel.kubeedge.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Ignore
    clientConfig:
      service:
        name: kubeedge-admission-service
        namespace: {{ .Release.Namespace }}
        path: /devicemodels
        port: 443
      caBundle: {{ .Values.controllerManager.webhook.caBundle }}
    rules:
      - apiGroups:
          - devices.kubeedge.io
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - devicemodels

  - name: validatedrule.kubeedge.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: kubeedge-admission-service
        namespace: {{ .Release.Namespace }}
        path: /rules
        port: 443
      caBundle: {{ .Values.controllerManager.webhook.caBundle }}
    rules:
      - apiGroups:
          - rules.kubeedge.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - rules

  - name: validatedruleendpoint.kubeedge.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: kubeedge-admission-service
        namespace: {{ .Release.Namespace }}
        path: /ruleendpoints
        port: 443
      caBundle: {{ .Values.controllerManager.webhook.caBundle }}
    rules:
      - apiGroups:
          - rules.kubeedge.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - ruleendpoints

  - name: validatenodeupgradejob.kubeedge.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: kubeedge-admission-service
        namespace: {{ .Release.Namespace }}
        path: /nodeupgradejobs
        port: 443
      caBundle: {{ .Values.controllerManager.webhook.caBundle }}
    rules:
      - apiGroups:
          - operations.kubeedge.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - nodeupgradejobs
{{- end }}
