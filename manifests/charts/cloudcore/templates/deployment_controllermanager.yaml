{{- if (.Values.controllerManager.enable) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- with .Values.controllerManager.labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.controllerManager.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
  name: kubeedge-controller-manager
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    {{- with .Values.controllerManager.labels }}
    matchLabels: {{- toYaml . | nindent 6 }}
    {{- end }}
  template:
    metadata:
      {{- with .Values.controllerManager.labels }}
      labels: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.controllerManager.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller-manager
          image: {{ .Values.controllerManager.image.repository }}:{{ .Values.controllerManager.image.tag }}
          imagePullPolicy: {{ .Values.controllerManager.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:9001
          {{- if .Values.controllerManager.webhook.enable }}
            - --webhook-port={{ .Values.controllerManager.webhook.port }}
            - --webhook-cert-dir={{ .Values.controllerManager.webhook.certDir }}
          {{- end }}
          ports:
            - name: healthz
              containerPort: 9001
              protocol: TCP
          {{- if .Values.controllerManager.webhook.enable }}
            - name: webhook
              containerPort: {{ .Values.controllerManager.webhook.port }}
              protocol: TCP
          {{- end }}
          {{- if and .Values.controllerManager.webhook.enable .Values.controllerManager.webhook.certsSecretName }}
          volumeMounts:
            - name: webhook-certs
              mountPath: {{ .Values.controllerManager.webhook.certDir }}
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.controllerManager.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
      {{- if and .Values.controllerManager.webhook.enable .Values.controllerManager.webhook.certsSecretName }}
      volumes:
        - name: webhook-certs
          secret:
            defaultMode: 420
            secretName: {{ .Values.controllerManager.webhook.certsSecretName }}
      {{- end }}
      restartPolicy: Always
      serviceAccountName: controller-manager
      {{- with .Values.controllerManager.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controllerManager.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
