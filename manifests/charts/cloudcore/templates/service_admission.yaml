{{- $webhookPort := default 9443 .Values.controllerManager.webhook.port }}
{{- if and .Values.controllerManager.webhook.enable (not .Values.controllerManager.enable) }}
{{- fail "controllerManager.enable must be true when controllerManager.webhook.enable is true" }}
{{- end }}
{{- if and .Values.controllerManager.webhook.enable (not .Values.controllerManager.webhook.certsSecretName) }}
{{- fail "controllerManager.webhook.certsSecretName is required when the controller-manager webhook is enabled" }}
{{- end }}
{{- if and .Values.controllerManager.webhook.enable (not .Values.controllerManager.webhook.caBundle) }}
{{- fail "controllerManager.webhook.caBundle is required when the controller-manager webhook is enabled" }}
{{- end }}
{{- if .Values.controllerManager.webhook.enable }}
apiVersion: v1
kind: Service
metadata:
  labels: {{- toYaml .Values.controllerManager.labels | nindent 4 }}
  name: kubeedge-admission-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: {{ $webhookPort }}
  selector: {{- toYaml .Values.controllerManager.labels | nindent 4 }}
  sessionAffinity: None
{{- end }}
